<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ada Example on LinkedIn: A long post | LinkedIn</title></head>
<body>
<!-- A LinkedIn post whose text sits behind "… more". Read in place, nothing is clicked: the
     button records a click in data-clicked. Saved fixture. -->
<main>
  <div class="feed-shared-update-v2" data-urn="urn:li:activity:7400000000000000002">
    <a class="update-components-actor__meta-link" href="https://www.linkedin.com/in/ada-example/">
      <span class="update-components-actor__title">Ada Example</span></a>
    <div class="update-components-text"><span>The first lines of a long post</span>
      <button onclick="document.body.dataset.clicked = 'yes'">… more</button></div>
    <button aria-label="2 reactions"><span>2</span></button>
  </div>
</main>
</body></html>
