name: Bug report
description: Something in the CLI, runtime, native host, or extension is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a specific workflow's selectors have drifted because a site changed, use the
        **Workflow broken** template instead. If this is a security issue, do not file it here —
        see [SECURITY.md](https://github.com/srv1n/rzn-browser/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got instead.
      placeholder: |
        I ran `rzn-browser run google search --param search_query="..."` and ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rzn-browser version
      description: Output of `rzn-browser --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141
  - type: dropdown
    id: install
    attributes:
      label: How did you install it
      options:
        - Install script / GitHub release
        - Built from source
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        Error output, and anything useful from the extension service worker console.
        Redact anything private — page content, cookies, tokens, personal data.
      render: shell
