name: Extension E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 3'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    name: Playwright (Chromium + Extension)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build runtime binaries for native-host chaos smoke
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          RUSTC_WRAPPER: ""
        run: cargo build -p rzn-browser -p rzn-native-host

      - name: Install dependencies (extension)
        working-directory: extension
        run: bun install

      - name: Build extension
        working-directory: extension
        run: RZN_PAGE_TEST_BRIDGE_ENABLED=1 bun run build:chrome

      - name: Install Playwright Chromium and deps
        working-directory: extension
        run: |
          bun x playwright install --with-deps chromium

      - name: Run Playwright tests (xvfb)
        working-directory: extension
        env:
          RZN_E2E_NATIVE_HOST_SMOKE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: |
          xvfb-run -a bun x playwright test --project=chromium-extension --reporter=dot

      - name: Upload test results (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-test-results
          path: extension/test-results
          if-no-files-found: ignore
