name: Extension E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    name: Playwright (Chromium + native-host chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build runtime binaries for native-host chaos smoke
        if: github.event_name != 'push'
        run: make build-rust

      - name: Build Chrome bundle for extension E2E
        env:
          RZN_PAGE_TEST_BRIDGE_ENABLED: '1'
        run: make build-ext

      - name: Build Chromium native-host test extension
        if: github.event_name != 'push'
        env:
          RZN_PAGE_TEST_BRIDGE_ENABLED: '0'
        run: make build-ext-chromium

      - name: Install Playwright Chromium and deps
        working-directory: extension
        run: |
          bun x playwright install --with-deps chromium

      - name: Run Playwright tests (xvfb)
        run: |
          xvfb-run -a make test-ext-e2e-run ARGS=''

      - name: Run Chromium native-host chaos smoke (xvfb)
        if: github.event_name != 'push'
        env:
          RZN_E2E_NATIVE_HOST_SMOKE: '1'
          RZN_E2E_CHAOS_BROWSER: chromium
        run: |
          xvfb-run -a make test-ext-e2e-run ARGS='tests/e2e/native_host_smoke.spec.ts --grep chaos:'

      - name: Upload test results (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-test-results
          path: extension/test-results
          if-no-files-found: ignore
